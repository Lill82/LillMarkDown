name: build

# Every push and PR: build + test.
# Pushing a tag like v1.2.0: also publish the single-file exe and attach it to a GitHub Release.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to create the release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $props = @('-p:PublishProfile=win-x64')
          if ('${{ github.ref_type }}' -eq 'tag') {
            $props += "-p:Version=$('${{ github.ref_name }}'.TrimStart('v'))"
          }
          dotnet publish LillMarkDown @props

      - uses: actions/upload-artifact@v5
        with:
          name: LillMarkDown
          path: LillMarkDown/bin/publish/LillMarkDown.exe

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" LillMarkDown/bin/publish/LillMarkDown.exe --title "LillMarkDown ${{ github.ref_name }}" --generate-notes
